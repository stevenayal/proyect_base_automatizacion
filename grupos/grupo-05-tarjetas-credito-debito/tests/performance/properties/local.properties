# Grupo 05 - Tarjetas de credito/debito (ambiente sandbox)
# Uso: jmeter -n -p <este archivo> -t <plan> -l <jtl> -JapiKey=<key>
protocol=https
host=aiquaa-sandbox-api.vercel.app
port=443

# Carga. 2 hilos x 10 iteraciones = 20 muestras por operacion, suficientes para
# que un cold start aislado caiga en el p99 y no distorsione el p95.
threads=2
rampUp=0
loops=10

# Rutas de los CSV (override con -JconsultaCsvPath=... / -JemisionCsvPath=...)
consultaCsvPath=grupos/grupo-05-tarjetas-credito-debito/tests/performance/data/grupo05_consulta_tarjetas.csv
emisionCsvPath=grupos/grupo-05-tarjetas-credito-debito/tests/performance/data/grupo05_emision_tarjetas.csv

# La api key NO se versiona: pasarla siempre por -JapiKey=<key>
