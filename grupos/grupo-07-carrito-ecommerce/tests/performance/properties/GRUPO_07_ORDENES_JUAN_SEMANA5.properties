# Grupo 07 - Juan - Semana 5 - Fase 1
# Cargar con -q. GRUPO07_API_KEY se lee del entorno del proceso Java.
g7.juan.week5.profile=GRUPO_07_ORDENES_JUAN_SEMANA5

protocol=https
host=aiquaa-sandbox-api.vercel.app
port=443
# Modelo finito y reproducible: muestras HTTP esperadas = threads * loops * 2.
threads=1
rampUp=0
loops=10
targetRpm=10

csvFile=grupos/grupo-07-carrito-ecommerce/tests/performance/data/D_GRUPO_07_ORDENES_JUAN_SEMANA5.csv
connectTimeoutMs=10000
responseTimeoutMs=30000

# No repetir automaticamente un POST ni consumir cupo adicional sin registrarlo.
httpclient4.retrycount=0
httpclient4.request_sent_retry_enabled=false

# JTL apto para evaluacion posterior, sin cuerpos ni cabeceras sensibles.
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.print_field_names=true
jmeter.save.saveservice.timestamp_format=ms
jmeter.save.saveservice.time=true
jmeter.save.saveservice.label=true
jmeter.save.saveservice.response_code=true
jmeter.save.saveservice.response_message=false
jmeter.save.saveservice.successful=true
jmeter.save.saveservice.assertion_results_failure_message=true
jmeter.save.saveservice.assertions=false
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.connect_time=true
jmeter.save.saveservice.thread_counts=true
jmeter.save.saveservice.thread_name=true
jmeter.save.saveservice.bytes=true
jmeter.save.saveservice.sent_bytes=true
jmeter.save.saveservice.url=true
jmeter.save.saveservice.data_type=true
jmeter.save.saveservice.response_data=false
jmeter.save.saveservice.response_data.on_error=false
jmeter.save.saveservice.requestHeaders=false
jmeter.save.saveservice.responseHeaders=false
jmeter.save.saveservice.samplerData=false
sample_variables=

# Percentiles observacionales; no son thresholds de aceptacion en Fase 1.
aggregate_rpt_pct1=50
aggregate_rpt_pct2=95
aggregate_rpt_pct3=99
log_level.org.apache.http=OFF
log_level.org.apache.jmeter.protocol.http=OFF
