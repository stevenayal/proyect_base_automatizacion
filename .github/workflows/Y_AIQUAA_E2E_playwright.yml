name: AIQUAA E2E - Playwright

on:
  push:
    branches: [main]
    paths:
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'reporter/**'
      - '.github/workflows/Y_AIQUAA_E2E_playwright.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'reporter/**'
      - '.github/workflows/Y_AIQUAA_E2E_playwright.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aiquaa-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke E2E en Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar dependencias del informe PDF
        run: pip install -r reporter/requirements.txt

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar casos smoke
        env:
          CI: 'true'
          BASE_URL: ${{ vars.AIQUAA_SANDBOX_BASE_URL || 'https://aiquaa-sandbox-web.vercel.app/' }}
        run: npm run smoke

      - name: Generar informe PDF con evidencias
        if: always() && hashFiles('results/playwright-results.json') != ''
        run: >
          python reporter/playwright_report.py
          --results results/playwright-results.json
          --output results/INFORME_E2E_AIQUAA_SANDBOX.pdf
          --app-name "AIQUAA Sandbox"
          --environment "GitHub Actions"
          --app-version "${{ github.sha }}"
          --repo-url "${{ github.server_url }}/${{ github.repository }}"
          --author "Base de automatización"

      - name: Publicar informe y evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiquaa-e2e-${{ github.run_number }}
          path: |
            playwright-report/
            results/playwright-results.json
            results/INFORME_E2E_AIQUAA_SANDBOX.pdf
            test-results/
          if-no-files-found: warn
          retention-days: 14
