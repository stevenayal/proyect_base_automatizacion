name: Performance JMeter - Grupo 09

on:
  push:
    branches:
      - grupo-09-reportes-dashboard-avalosroman
    paths:
      - 'grupos/grupo-09-reportes-dashboard/tests/performance/**'
      - '.github/workflows/performance-grupo-09.yml'
  workflow_dispatch: {}

jobs:
  jmeter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Descargar JMeter 5.6.3
        run: |
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          echo "$PWD/apache-jmeter-5.6.3/bin" >> $GITHUB_PATH

      - name: Ejecutar JMeter (sin GUI)
        env:
          BASE_URL: ${{ secrets.AIQUAA_BASE_URL }}
          API_KEY:  ${{ secrets.AIQUAA_API_KEY }}
        run: |
          mkdir -p grupos/grupo-09-reportes-dashboard/evidence/semana-05
          jmeter -n \
            -t "grupos/grupo-09-reportes-dashboard/tests/performance/plans/Grupo09_RF-G9-01_Reportes.jmx" \
            -JbaseUrl=$BASE_URL \
            -JapiKey=$API_KEY \
            -l "grupos/grupo-09-reportes-dashboard/evidence/semana-05/results.jtl" \
            -j "grupos/grupo-09-reportes-dashboard/evidence/semana-05/jmeter.log" \
            -e -o "grupos/grupo-09-reportes-dashboard/evidence/semana-05/html"

      - name: Verificar limites
        run: |
          python grupos/grupo-09-reportes-dashboard/tests/performance/scripts/verify-thresholds.py \
            grupos/grupo-09-reportes-dashboard/evidence/semana-05/results.jtl

      - name: Subir evidencia como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-grupo09
          path: grupos/grupo-09-reportes-dashboard/evidence/semana-05/
          retention-days: 15
