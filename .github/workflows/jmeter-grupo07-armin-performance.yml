name: JMeter Grupo 07 Armin - Crear Ordenes (con informe PDF)

# Sin trigger de push sobre la rama del grupo: con el PR abierto, cada push
# disparaba la misma medicion dos veces (push + pull_request) sobre la misma
# api-key. Para correr sin PR abierto esta workflow_dispatch.
on:
  pull_request:
    branches: ["main"]
    paths:
      - "grupos/grupo-07-carrito-ecommerce/tests/performance/**"
      - "jmeter-grupo07-armin-performance.yml"
  workflow_dispatch:
    inputs:
      threads:
        description: "Usuarios concurrentes (threads)"
        required: false
        default: "3"
      loops:
        description: "Iteraciones por thread"
        required: false
        default: "20"
      monitoring_dashboard_url:
        description: >-
          URL publica de un dashboard de monitoreo (Grafana, etc.) a capturar como
          evidencia post-ejecucion; dejar vacio para omitir la captura.
        required: false
        default: https://purplespinach239.grafana.net/public-dashboards/ce95c3fa413048d3a79d3c6fc60de958

permissions:
  contents: read

# El rate limit del sandbox es por api-key, no por corrida: dos ejecuciones
# simultaneas se roban las 30 req/min entre si y ambas terminan en 429. Se
# serializan las corridas de este workflow en vez de cancelarlas, para que un
# push seguido de otro no invalide la medicion.
concurrency:
  group: aiquaa-sandbox-grupo07-andrea
  cancel-in-progress: false

env:
  JMETER_VERSION: 5.6.3
  RESULTS_DIR: test-results/performance/grupo07-andrea
  API_BASE: https://aiquaa-sandbox-api.vercel.app
  # URL de monitoreo: el default aplica a TODOS los eventos (pull_request y
  # workflow_dispatch). En un run por pull_request no existe inputs.*, por eso
  # no se usa el default del input y la URL vive aca. El input solo la override.
  MONITORING_URL: ${{ inputs.monitoring_dashboard_url || 'https://purplespinach239.grafana.net/public-dashboards/ce95c3fa413048d3a79d3c6fc60de958' }}
  # La api key no vive en el .jmx. Si el secret no esta cargado se usa la key
  # publica del sandbox que se repartio en clase, para que el workflow siga
  # siendo ejecutable por cualquiera del grupo.
  API_KEY: ${{ secrets.GRUPO07_API_KEY || 'sbx_demo_f581ca21e68a347288c94d71' }}

jobs:
  performance:
    name: JMeter Grupo 07 Armin + informe PDF
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar Java (requerido por JMeter)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar JMeter
        run: |
          curl --fail --location --silent --show-error \
            "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz" -o jmeter.tgz
          tar -xzf jmeter.tgz

      - name: Esperar a que haya cupo en el rate limit
        run: |
          bash grupos/grupo-07-carrito-ecommerce/tests/performance/scripts/esperar-cupo-api.sh \
            "${API_KEY}" "${API_BASE}"

      - name: Ejecutar plan de carga headless
        run: |
          mkdir -p "${RESULTS_DIR}/dashboard"
          "apache-jmeter-${JMETER_VERSION}/bin/jmeter" -n \
            -t grupos/grupo-07-carrito-ecommerce/tests/performance/plans/crear_ordenes_armin.jmx \
            -l "${RESULTS_DIR}/crear_ordenes_armin.jtl" \
            -e -o "${RESULTS_DIR}/dashboard" \
            -JcsvFile=grupos/grupo-07-carrito-ecommerce/tests/performance/data/datos_ordenes.csv \
            -JapiKey="${API_KEY}" \
            -Jthreads="${{ inputs.threads || '3' }}" \
            -Jloops="${{ inputs.loops || '20' }}"

      - name: Configurar Python (captura de monitoreo)
        if: ${{ env.MONITORING_URL != '' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Capturar evidencia del dashboard de monitoreo
        # Chrome viene preinstalado en los runners ubuntu-latest, y Selenium Manager
        # resuelve el driver por su cuenta. La espera larga cubre el arranque en frio
        # de un stack de Grafana Cloud, que duerme cuando esta inactivo.
        if: ${{ env.MONITORING_URL != '' }}
        run: |
          pip install selenium
          mkdir -p "${RESULTS_DIR}/evidence"
          CAPTURE=$(npm pack aiquaa-performance-mcp-server --pack-destination . --silent)
          tar -xzf "$CAPTURE" package/dist/monitoring/python/capture_dashboard.py
          python3 package/dist/monitoring/python/capture_dashboard.py \
            --url "${{ env.MONITORING_URL }}" \
            --output "${RESULTS_DIR}/evidence/EVIDENCIA_MONITOREO.png" \
            --wait-seconds 8 \
            --timeout-seconds 180

      - name: Generar informe PDF
        if: always()
        run: |
          EVIDENCE_ARGS=()
          if [ -f "${RESULTS_DIR}/evidence/EVIDENCIA_MONITOREO.png" ]; then
            EVIDENCE_ARGS=(--evidence-image "${RESULTS_DIR}/evidence/EVIDENCIA_MONITOREO.png" \
              --evidence-label "Dashboard de monitoreo" \
              --evidence-url "${{ env.MONITORING_URL }}")
          fi
          # El generador sale con codigo 1 cuando el veredicto es FAIL. Aca solo
          # interesa producir el PDF; el gate del SLA es "Evaluar umbrales".
          set +e
          npx -y aiquaa-performance-mcp-server --report \
            "${RESULTS_DIR}/crear_ordenes_armin.jtl" \
            grupos/grupo-07-carrito-ecommerce/tests/performance/thresholds/thresholds.json \
            "${RESULTS_DIR}/INFORME_PERF_ORDENES.pdf" \
            --api-name "AIQUAA Sandbox API (ordenes - Grupo 07 Andrea)" \
            --plan grupos/grupo-07-carrito-ecommerce/tests/performance/plans/crear_ordenes_armin.jmx \
            --test-type carga \
            --threads "${{ inputs.threads || '3' }}" \
            --loops "${{ inputs.loops || '20' }}" \
            --author "${{ github.triggering_actor }}" \
            --api-version "${{ github.sha }}" \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            "${EVIDENCE_ARGS[@]}"
          status=$?
          set -e
          if [ ! -f "${RESULTS_DIR}/INFORME_PERF_ORDENES.pdf" ]; then
            echo "::error::No se genero el informe PDF (exit ${status})."
            exit "${status}"
          fi

      - name: Evaluar umbrales (SLA)
        # Corre despues del informe para que el PDF se publique aun si el SLA falla.
        run: |
          npx -y aiquaa-performance-mcp-server --evaluate \
            "${RESULTS_DIR}/crear_ordenes_armin.jtl" \
            grupos/grupo-07-carrito-ecommerce/tests/performance/thresholds/thresholds.json

      - name: Subir resultados e informe
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jmeter-grupo07-andrea-ordenes
          path: test-results/performance/grupo07-andrea
          retention-days: 7