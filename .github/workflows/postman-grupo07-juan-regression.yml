name: Postman Regression - Grupo 07 - Juan Barreto

on:
  push:
    branches: [grupo-07-carrito-ecommerce-entrega]
    paths:
      - .github/workflows/postman-grupo07-juan-regression.yml
      - postman/grupo-07-juan-barreto-carrito-e-commerce.postman_collection.json
      - scripts/grupo07/newman_report.py
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Pruebas de Juan a ejecutar desde la rama seleccionada
        type: choice
        options: [postman, jmeter, all]
        default: postman

permissions:
  contents: read

jobs:
  newman-juan:
    if: (github.event_name != 'workflow_dispatch' || inputs.suite != 'jmeter') && (github.event_name != 'pull_request' || github.head_ref == 'grupo-07-carrito-ecommerce-entrega')
    concurrency:
      group: grupo07-juan-sandbox
      cancel-in-progress: false
    name: Juan Barreto - Newman + PDF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verificar configuracion externa
        id: config
        shell: bash
        env:
          GRUPO07_BASE_URL: ${{ vars.GRUPO07_BASE_URL }}
          GRUPO07_API_KEY: ${{ secrets.GRUPO07_API_KEY }}
        run: |
          if [[ -z "${GRUPO07_BASE_URL//[[:space:]]/}" || -z "${GRUPO07_API_KEY//[[:space:]]/}" ]]; then
            echo "::error::REGRESION_NO_EJECUTADA: faltan GRUPO07_BASE_URL o GRUPO07_API_KEY."
            echo "REGRESION_NO_EJECUTADA: configuracion incompleta; no es una prueba aprobada." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar ReportLab
        run: python -m pip install reportlab

      - name: Ejecutar Newman - Juan Barreto
        id: newman
        env:
          GRUPO07_BASE_URL: ${{ vars.GRUPO07_BASE_URL }}
          GRUPO07_API_KEY: ${{ secrets.GRUPO07_API_KEY }}
        run: |
          mkdir -p newman
          npx --yes newman@6.2.2 run \
            postman/grupo-07-juan-barreto-carrito-e-commerce.postman_collection.json \
            --env-var "baseUrl=$GRUPO07_BASE_URL" \
            --env-var "apiKey=$GRUPO07_API_KEY" \
            --delay-request 800 \
            --reporters cli,json \
            --reporter-json-export newman/results.json

      # On real test failures still create a FAIL PDF; never mask Newman's exit.
      - name: Validar alcance y generar PDF
        id: report
        if: ${{ !cancelled() && (steps.newman.outcome == 'success' || steps.newman.outcome == 'failure') }}
        run: |
          python scripts/grupo07/newman_report.py \
            --results newman/results.json \
            --output newman/report.pdf \
            --expected-requests 3 --expected-assertions 14
          test -s newman/report.pdf

      - name: Subir reporte PDF
        id: upload
        if: ${{ !cancelled() && hashFiles('newman/report.pdf') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: informe-regresion-grupo07-juan
          path: newman/report.pdf
          retention-days: 7
          if-no-files-found: error

      - name: Certificar ejecucion completa
        if: ${{ always() }}
        env:
          CONFIG: ${{ steps.config.outcome }}
          NEWMAN: ${{ steps.newman.outcome }}
          REPORT: ${{ steps.report.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          if [[ "$NEWMAN" == "skipped" || "$CONFIG" != "success" ]]; then
            echo "REGRESION_NO_EJECUTADA: no aprobar. Un success externo con tests omitidos seria GREEN_CON_TESTS_SKIPPED." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$NEWMAN" != "success" || "$REPORT" != "success" || "$UPLOAD" != "success" || -z "$ARTIFACT_ID" ]]; then
            echo "FAILED_REAL: ejecucion o publicacion incompleta." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          test -s newman/results.json
          test -s newman/report.pdf
          echo "GREEN_REAL: Newman ejecutado; 3 requests, 14 assertions, cero fallos; JSON validado, PDF no vacio, artifact $ARTIFACT_ID publicado." >> "$GITHUB_STEP_SUMMARY"

  # This dispatcher already exists on main. Its repaired entrega version can
  # call the new workflow at the same commit before it is registered on main.
  jmeter-manual:
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'jmeter' || inputs.suite == 'all')
    uses: ./.github/workflows/jmeter-grupo07-juan-performance.yml
    secrets: inherit
