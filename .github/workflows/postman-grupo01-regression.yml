name: Postman Regression - Grupo 01 Autenticacion y Acceso

on:
  push:
    branches: ["main"]
    paths:
      - "postman/C_GRUPO_01_AUTENTICACION_ACCESO.json"
      - "postman/E_GRUPO_01_AUTENTICACION.json"
      - "skills/postman-newman-skill/reporter/**"
      - ".github/workflows/postman-grupo01-regression.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "postman/C_GRUPO_01_AUTENTICACION_ACCESO.json"
      - "postman/E_GRUPO_01_AUTENTICACION.json"
      - "skills/postman-newman-skill/reporter/**"
      - ".github/workflows/postman-grupo01-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postman-grupo01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  newman-regression:
    name: Newman + informe PDF
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias Node
        run: npm ci

      - name: Instalar dependencias del generador de informes
        run: pip install -r skills/postman-newman-skill/reporter/requirements.txt

      - name: Validar configuracion requerida
        env:
          GRUPO01_API_KEY: ${{ secrets.GRUPO01_API_KEY }}
        run: |
          if [[ -z "$GRUPO01_API_KEY" ]]; then
            echo "::error::Falta configurar el secreto GRUPO01_API_KEY en el repositorio."
            exit 1
          fi

      - name: Ejecutar regresion Postman - Grupo 01
        env:
          GRUPO01_BASE_URL: ${{ vars.GRUPO01_BASE_URL }}
          GRUPO01_API_KEY: ${{ secrets.GRUPO01_API_KEY }}
        run: |
          mkdir -p newman

          argumentos=(
            postman/C_GRUPO_01_AUTENTICACION_ACCESO.json
            --environment postman/E_GRUPO_01_AUTENTICACION.json
            --delay-request 800
            --reporters cli,json
            --reporter-json-export newman/results.json
          )

          if [[ -n "$GRUPO01_BASE_URL" ]]; then
            argumentos+=(--env-var "baseUrl=$GRUPO01_BASE_URL")
          fi

          argumentos+=(--env-var "apiKey=$GRUPO01_API_KEY")

          npx newman run "${argumentos[@]}"

      - name: Generar informe PDF
        if: always() && hashFiles('newman/results.json') != ''
        run: >
          python skills/postman-newman-skill/reporter/newman_report.py
          --results newman/results.json
          --banner skills/postman-newman-skill/reporter/assets/banner_portada.png
          --logo-aiquaa skills/postman-newman-skill/reporter/assets/logo_aiquaa_circle.png
          --logo-postman skills/postman-newman-skill/reporter/assets/logo_postman_clean.png
          --repo-url "${{ github.server_url }}/${{ github.repository }}"
          --api-version "${{ github.sha }}"
          --author "${{ github.triggering_actor }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --output newman/report.pdf

      - name: Subir resultados e informe de la regresion
        if: always() && hashFiles('newman/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: informe-regresion-grupo01-${{ github.run_number }}
          path: |
            newman/results.json
            newman/report.pdf
          if-no-files-found: warn
          retention-days: 7
