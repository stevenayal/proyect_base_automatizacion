name: Grupo 09 - BDD Cucumber + Playwright

on:
  push:
    branches: ["main"]
    paths:
      - "grupos/grupo-09-reportes-dashboard/**"
      - "tests/bdd/steps/grupo09-reportes-dashboard.steps.ts"
      - ".github/workflows/grupo09-bdd-e2e.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "grupos/grupo-09-reportes-dashboard/**"
      - "tests/bdd/steps/grupo09-reportes-dashboard.steps.ts"
      - ".github/workflows/grupo09-bdd-e2e.yml"
  workflow_dispatch:

env:
  BASE_URL: "https://aiquaa-sandbox-web.vercel.app"
  API_URL: "https://aiquaa-sandbox-api.vercel.app"
  # COMPLETAR: email del usuario de prueba y la api key del sandbox.
  TEST_USER: "admin@aiquaa.com"
  SANDBOX_API_KEY: "sbx_demo_f581ca21e68a347288c94d71"

jobs:
  bdd:
    name: Cucumber + Playwright (Reportes y Dashboard)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Configurar Python (generador del informe PDF)
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar dependencias Python (reportlab, Pillow)
        run: pip install -r skills/postman-newman-skill/reporter/requirements.txt

      - name: Ejecutar escenarios BDD del Grupo 09
        run: >
          npx cucumber-js --profile grupo09
          --format "json:grupos/grupo-09-reportes-dashboard/evidence/cucumber-report.json"

      - name: Generar informe PDF del BDD
        if: always()
        run: >
          python grupos/grupo-09-reportes-dashboard/reporter/cucumber_report.py
          --results grupos/grupo-09-reportes-dashboard/evidence/cucumber-report.json
          --output grupos/grupo-09-reportes-dashboard/evidence/INFORME_BDD_GRUPO09.pdf
          --title "Grupo 09 - Reportes y Dashboard"
          --banner skills/postman-newman-skill/reporter/assets/banner_portada.png
          --logo-aiquaa skills/postman-newman-skill/reporter/assets/logo_aiquaa_circle.png
          --logo-postman skills/postman-newman-skill/reporter/assets/logo_postman_clean.png
          --repo-url "${{ github.server_url }}/${{ github.repository }}"
          --api-version "${{ github.sha }}"
          --author "${{ github.triggering_actor }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Subir informe PDF (visible directo desde la run)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: informe-bdd-grupo09-pdf
          path: grupos/grupo-09-reportes-dashboard/evidence/INFORME_BDD_GRUPO09.pdf
          archive: false
          retention-days: 7

      - name: Subir evidencias (reporte + capturas si las hay)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bdd-grupo09-reportes-dashboard
          path: |
            grupos/grupo-09-reportes-dashboard/evidence/**
            playwright-report/**
          retention-days: 7
