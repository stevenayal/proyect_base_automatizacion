name: Postman Regression - Grupo 09 Reportes Dashboard (con reporte PDF en Python)

on:
  push:
    branches:
      - "grupo-09-reportes-dashboard-avalosroman"
    paths:
      - "grupos/grupo-09-reportes-dashboard/evidence/semana-03/grupo-9-reportes-y-dashboard.postman_collection.json"
      - ".github/workflows/postman-grupo09-regression.yml"
  pull_request:
    branches:
      - "grupo-09-reportes-dashboard-avalosroman"
    paths:
      - "grupos/grupo-09-reportes-dashboard/evidence/semana-03/grupo-9-reportes-y-dashboard.postman_collection.json"
      - ".github/workflows/postman-grupo09-regression.yml"
  workflow_dispatch:

jobs:
  newman-regression:
    name: Newman + reporte PDF (Python) - Grupo 09
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Configurar Python (generador de PDF)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias Node
        run: npm install

      - name: Instalar dependencias Python (reportlab, Pillow)
        run: pip install -r scripts/requirements-newman-report.txt

      - name: Preparar carpeta de resultados
        run: mkdir -p newman

      - name: Ejecutar regresión Postman (Newman) - Grupo 09
        env:
          SQL_SANDBOX_BASE_URL: ${{ vars.sqlSandboxBaseUrl }}
          SQL_SANDBOX_API_KEY: ${{ secrets.SQLSANDBOXAPIKEY }}
          G9_MOVIMIENTO_ID: ${{ vars.g9_movimiento_id }}
          G9_NUEVO_REFERENCIA: ${{ vars.g9_nuevo_referencia }}
          G9_NUEVA_DESCRIPCION: ${{ vars.g9_nueva_descripcion }}
          G9_NUEVO_TIPO: ${{ vars.g9_nuevo_tipo }}
          G9_NUEVO_MONTO: ${{ vars.g9_nuevo_monto }}
          G9_MOVS_ANTES: ${{ vars.g9_movs_antes }}
          G9_MOVS_SNAPSHOT_DB: ${{ vars.g9_movs_snapshot_db }}
          G9_MOVS_IDS_DB: ${{ vars.g9_movs_ids_db }}
          G9_MOVS_COUNT: ${{ vars.g9_movs_count }}
          G9_RESUMEN_ULTIMO: ${{ vars.g9_resumen_ultimo }}
          G9_RESUMEN_PRIMERO: ${{ vars.g9_resumen_primero }}
          G9_RESUMEN_TOTAL: ${{ vars.g9_resumen_total }}
          G9_RESUMEN_CANTIDAD: ${{ vars.g9_resumen_cantidad }}
          G9_TIPOS_ESPERADOS: ${{ vars.g9_tipos_esperados }}
          G9_HASTA: ${{ vars.g9_hasta }}
          G9_DESDE: ${{ vars.g9_desde }}
          G9_MOVS_ESPERADOS: ${{ vars.g9_movs_esperados }}
          G9_USUARIO_ID: ${{ vars.g9_usuario_id }}
          G9_USER_ID: ${{ vars.g9_user_id }}
        run: |
          npx newman run "grupos/grupo-09-reportes-dashboard/evidence/semana-03/grupo-9-reportes-y-dashboard.postman_collection.json" \
            --env-var "baseUrl=${BASE_URL}" \
            --env-var "apiKey=${API_KEY}" \
            --delay-request 800 \
            --reporters cli,json,junit \
            --reporter-json-export newman/results.json \
            --reporter-junit-export newman/results.xml

      - name: Generar reporte PDF
        if: always()
        run: |
          python skills/postman-newman-skill/reporter/newman_report.py \
            --results newman/results.json \
            --banner skills/postman-newman-skill/reporter/assets/banner_portada.png \
            --logo-aiquaa skills/postman-newman-skill/reporter/assets/logo_aiquaa_circle.png \
            --logo-postman skills/postman-newman-skill/reporter/assets/logo_postman_clean.png \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --api-version "${{ github.sha }}" \
            --author "${{ github.triggering_actor }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output newman/report.pdf

      - name: Subir informe PDF de la regresión
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-regresion-grupo09
          path: newman/report.pdf
          if-no-files-found: warn
          retention-days: 7