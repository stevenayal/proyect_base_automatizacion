name: Postman Regression - Grupo 10 Roles y Permisos - Julieta

on:
  push:
    branches: ["main", "grupo-10-roles-permisos"]
    paths:
      - "postman/Grupo-10-Administracion-Roles-Permisos.postman_collection.json"
      - "postman/Grupo-10-Administracion-Roles-Permisos.postman_environment.json"
      - ".github/workflows/postman-grupo10-regression-julieta.yml"
      - "skills/postman-newman-skill/reporter/**"
  pull_request:
    branches: ["main"]
    paths:
      - "postman/Grupo-10-Administracion-Roles-Permisos.postman_collection.json"
      - "postman/Grupo-10-Administracion-Roles-Permisos.postman_environment.json"
      - ".github/workflows/postman-grupo10-regression-julieta.yml"
      - "skills/postman-newman-skill/reporter/**"
  workflow_dispatch:

jobs:
  newman-regression:
    name: Newman + reporte PDF (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar dependencias Node
        run: npm install

      - name: Instalar dependencias Python
        run: pip install -r skills/postman-newman-skill/reporter/requirements.txt

      - name: Validar colección Postman
        run: >
          node -e "const c=JSON.parse(require('fs').readFileSync('postman/Grupo-10-Administracion-Roles-Permisos.postman_collection.json','utf8'));
          if(!Array.isArray(c.item)||c.item.length===0)throw new Error('El archivo indicado no contiene requests Postman (propiedad item). Exporta y confirma la colección del Grupo 10.');"

      - name: Ejecutar regresión Postman (Newman) - Grupo 10
        run: >
          npx newman run postman/Grupo-10-Administracion-Roles-Permisos.postman_collection.json
          --environment postman/Grupo-10-Administracion-Roles-Permisos.postman_environment.json
          --env-var "baseUrl=${{ vars.GRUPO10_BASE_URL }}"
          --env-var "apiKey=${{ secrets.GRUPO10_API_KEY }}"
          --delay-request 800
          --reporters cli,json
          --reporter-json-export newman/results.json

      - name: Generar reporte PDF
        if: always() && hashFiles('newman/results.json') != ''
        run: >
          python skills/postman-newman-skill/reporter/newman_report.py
          --results newman/results.json
          --banner skills/postman-newman-skill/reporter/assets/banner_portada.png
          --logo-aiquaa skills/postman-newman-skill/reporter/assets/logo_aiquaa_circle.png
          --logo-postman skills/postman-newman-skill/reporter/assets/logo_postman_clean.png
          --repo-url "${{ github.server_url }}/${{ github.repository }}"
          --api-version "${{ github.sha }}"
          --author "${{ github.triggering_actor }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --output newman/report-grupo10.pdf

      - name: Subir informe PDF de la regresión
        uses: actions/upload-artifact@v7
        if: always() && hashFiles('newman/report-grupo10.pdf') != ''
        with:
          name: informe-regresion-grupo10
          path: newman/report-grupo10.pdf
          retention-days: 7