# 1. Confirmar que estamos trabajando sobre Grupo 08
$workflow = ".github\workflows\Y_GRUPO08_JMETER_GRAFANA.yml"
$jmx = "grupos\grupo-08-reservas-turnos\TAREA 5 SALMAGIMENEZ\reservas_performance.jmx"

# 2. Ajustar el JMX para recibir la API Key desde GitHub Actions
$contenidoJmx = Get-Content $jmx -Raw
$contenidoJmx = $contenidoJmx.Replace('${apiKey}', '${__P(apiKey)}')
Set-Content $jmx -Value $contenidoJmx -Encoding UTF8

# 3. Generar el workflow completo
@'
name: JMeter Grupo 08 - Salma

on:
  push:
    branches:
      - grupo-08-reservas-turnos
    paths:
      - "grupos/grupo-08-reservas-turnos/TAREA 5 SALMAGIMENEZ/**"
      - ".github/workflows/Y_GRUPO08_JMETER_GRAFANA.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar JMeter
        run: |
          curl --fail --location --silent --show-error https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz -o jmeter.tgz
          tar -xzf jmeter.tgz
          echo "$GITHUB_WORKSPACE/apache-jmeter-5.6.3/bin" >> "$GITHUB_PATH"

      - name: Crear carpeta de resultados
        run: mkdir -p test-results/performance

      - name: Ejecutar JMeter Grupo 08
        working-directory: grupos/grupo-08-reservas-turnos/TAREA 5 SALMAGIMENEZ
        env:
          API_KEY: ${{ secrets.SANDBOX_API_KEY }}
        run: |
          jmeter -n \
            -t "reservas_performance.jmx" \
            -JapiKey="$API_KEY" \
            -l "$GITHUB_WORKSPACE/test-results/performance/resultado_salma.jtl"

      - name: Subir resultados JMeter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-grupo08-salma
          path: test-results/performance/
          if-no-files-found: warn
'@ | Set-Content $workflow -Encoding UTF8