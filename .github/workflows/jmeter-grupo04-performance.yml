name: JMeter Grupo 04 - Onboarding

on:
  workflow_dispatch:
    inputs:
      threads:
        description: "Usuarios concurrentes"
        required: false
        default: "1"
      loops:
        description: "Iteraciones por usuario"
        required: false
        default: "3"
  push:
    branches: ["grupo-04-registro-onboarding"]
    paths:
      - "tests/performance/**"
      - "monitoring/**"
      - ".github/workflows/jmeter-grupo04-performance.yml"

permissions:
  contents: read

env:
  JMETER_VERSION: 5.6.3
  RESULTS_DIR: test-results/performance/grupo04

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Selenium
        run: |
          python -m pip install selenium

      - name: Instalar JMeter
        run: |
          curl --fail --location --silent --show-error \
            "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz" \
            --output jmeter.tgz
          tar -xzf jmeter.tgz

      - name: Ejecutar plan de carga
        env:
          API_KEY: ${{ secrets.GRUPO04_API_KEY }}
        run: |
          mkdir -p "${RESULTS_DIR}/dashboard"
          "apache-jmeter-${JMETER_VERSION}/bin/jmeter" -n \
            -t tests/performance/plans/Grupo04_Onboarding_BD.jmx \
            -l "${RESULTS_DIR}/grupo04-resultados.jtl" \
            -e -o "${RESULTS_DIR}/dashboard" \
            -JapiKey="${API_KEY}" \
            -Jthreads="${{ inputs.threads || '1' }}" \
            -Jloops="${{ inputs.loops || '3' }}" \
            -JdelayMs=2500

      - name: Capturar evidencia de Grafana
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "${RESULTS_DIR}/evidence"

          python grupos/grupo-04-registro-onboarding/monitoring/capture_grafana.py

          if [ -f "grupos/grupo-04-registro-onboarding/resultados/evidencia/EVIDENCIA_MONITOREO.png" ]; then
            cp "grupos/grupo-04-registro-onboarding/resultados/evidencia/EVIDENCIA_MONITOREO.png" \
              "${RESULTS_DIR}/evidence/EVIDENCIA_MONITOREO.png"

            echo "Evidencia Grafana copiada correctamente."
          else
            echo "No se encontró la evidencia de Grafana."
          fi

      - name: Generar informe PDF
        if: always()
        run: |
          EVIDENCE_ARGS=()

          if [ -f "${RESULTS_DIR}/evidence/EVIDENCIA_MONITOREO.png" ]; then
            EVIDENCE_ARGS=(
              --evidence-image "${RESULTS_DIR}/evidence/EVIDENCIA_MONITOREO.png"
              --evidence-label "Dashboard de monitoreo"
              --evidence-url "https://purplespinach239.grafana.net/public-dashboards/ce95c3fa413048d3a79d3c6fc60de958"
            )

            echo "Se incluirá evidencia de Grafana en el informe."
          else
            echo "No se encontró evidencia de Grafana. Se continúa sin ella."
          fi

          npx -y aiquaa-performance-mcp-server --report \
            "${RESULTS_DIR}/grupo04-resultados.jtl" \
            tests/performance/thresholds/grupo04-thresholds.json \
            "${RESULTS_DIR}/INFORME_JMETER_GRUPO04.pdf" \
            --api-name "AIQUAA Sandbox - Onboarding" \
            --plan tests/performance/plans/Grupo04_Onboarding_BD.jmx \
            --test-type carga \
            --threads "${{ inputs.threads || '1' }}" \
            --loops "${{ inputs.loops || '3' }}" \
            --author "${{ github.triggering_actor }}" \
            --api-version "${{ github.sha }}" \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            "${EVIDENCE_ARGS[@]}"

      - name: Evaluar umbrales
        run: |
          npx -y aiquaa-performance-mcp-server --evaluate \
            "${RESULTS_DIR}/grupo04-resultados.jtl" \
            tests/performance/thresholds/grupo04-thresholds.json

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-grupo04-onboarding
          path: test-results/performance/grupo04/
          retention-days: 7
