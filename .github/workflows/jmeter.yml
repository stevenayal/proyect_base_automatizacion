name: JMeter Roles y Permisos

on:
  workflow_dispatch:

jobs:
  jmeter-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz

      - name: Run headless
        run: |
          mkdir -p test-results/performance/dashboard
          apache-jmeter-5.6.3/bin/jmeter -n \
            -t grupos/grupo-10-roles-permisos/tests/e2e/performance/Semana4-10-roles-permisos.jmx \
            -l test-results/performance/R_ROLES_PERMISOS.jtl \
            -e -o test-results/performance/dashboard

      - name: Upload Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: test-results/performance/