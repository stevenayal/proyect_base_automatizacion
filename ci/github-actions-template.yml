name: team-qa-smoke

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Newman placeholder
        run: echo "Reemplazar por ejecucion real de Newman del equipo"

      - name: Playwright placeholder
        run: echo "Reemplazar por smoke UI del equipo"
