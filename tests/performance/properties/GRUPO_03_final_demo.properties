# Plan final del Grupo 03 - corrida DEMO para mostrar en vivo en clase.
# 6 fases x 5 muestras a 10 req/min: ~3-4 min. Sin saturacion.
protocol=https
host=aiquaa-sandbox-api.vercel.app
port=443

# Muestras por endpoint (tamano del lote de facturas que recorren las 6 fases).
muestras=5
# Ritmo de cada fase. La API key es compartida entre grupos: el techo real medido
# fue ~10-15 req/min, no los 30 del limite nominal.
rpm=10
# Titular de las facturas. Vacio = el usuario activo con menos facturas pendientes.
titular=

# 429 provocados por otros grupos: se reintenta respetando Retry-After (tope esperaMax429 s).
maxReintentos429=3
esperaMax429=60

# Saturacion de lecturas (informativa). 0 hilos = no corre.
satHilos=0
satRampa=10
satDuracion=90
pausaSaturacion=0

# El backend cierra conexiones keep-alive ociosas (Socket Closed / Connection reset).
httpclient4.retrycount=1
httpclient4.idletimeout=5000
# API key publica del sandbox de clase. No usar este archivo para credenciales reales.
apiKey=sbx_demo_f581ca21e68a347288c94d71
